<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg78" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050508"/>
      <stop offset="100%" style="stop-color:#101018"/>
    </linearGradient>
    <linearGradient id="shroom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00ff"/>
      <stop offset="50%" style="stop-color:#00ffaa"/>
      <stop offset="100%" style="stop-color:#ffaa00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg78)"/>
  <!-- Fractal spiral -->
  <path d="M16 8 Q22 10 20 14 Q18 18 14 16 Q10 14 12 10 Q14 6 18 8 Q22 10 19 13 Q16 16 13 14"
        stroke="url(#shroom)" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Volume dots -->
  <circle cx="16" cy="16" r="3" fill="#ff00ff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="12" cy="20" r="2" fill="#00ffaa" opacity="0.6"/>
  <circle cx="20" cy="20" r="2" fill="#ffaa00" opacity="0.6"/>
  <circle cx="16" cy="24" r="1.5" fill="#ff00ff" opacity="0.4"/>
</svg>
